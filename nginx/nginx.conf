user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 72;
    keepalive_requests 1000;

    # Disable access log for speed tests (high-volume)
    access_log /var/log/nginx/access.log combined buffer=16k flush=5s;

    # Gzip (only for text, not binary streams)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_comp_level 4;
    gzip_min_length 1000;

    # Client body for uploads
    client_max_body_size 512m;
    client_body_timeout 120s;
    client_header_timeout 30s;

    # Proxy settings
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_buffering off;         # Critical: disable buffering for streaming
    proxy_request_buffering off; # Critical: disable for upload streaming

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=ping:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=test:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:3001;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Connection limit per IP
        limit_conn conn 20;

        # WebSocket upgrade for backend /ws
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # Ping endpoint — high frequency allowed
        location = /api/ping {
            limit_req zone=ping burst=60 nodelay;
            proxy_pass http://backend/ping;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache off;
            add_header Cache-Control "no-cache, no-store";
        }

        # Download — streaming, no buffering
        location = /api/download {
            limit_req zone=test burst=10;
            proxy_pass http://backend/download;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-cache, no-store";
            add_header X-Accel-Buffering no;
        }

        # Upload — disable request buffering
        location = /api/upload {
            limit_req zone=test burst=10;
            proxy_pass http://backend/upload;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 30s;
        }

        # All other /api/* → backend
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend — everything else
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speednetwork-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      REGION: "${REGION:-local}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-*}"
    expose:
      - "3001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: speednetwork-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: "http://backend:3001"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-}"
    expose:
      - "3000"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: speednetwork-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
